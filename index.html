<script type="text/javascript">
    (function() {
        // Lista de palabras clave comunes en User-Agents de bots y rastreadores
        const botPattern = /bot|crawler|spider|slurp|google|baidu|bing|msn|duckduckgo|teoma|yahoo|yandex|facebookexternalhit|twitterbot|linkedinbot|embedly|FacebookBot|Meta-WebIndexer|quora/i;
        
        // Comprobación del User-Agent actual
        if (botPattern.test(navigator.userAgent)) {
            // Si coincide con un bot, redirige a YouTube
            window.location.href = "https://youtu.be/pwB70jbidDI?si=q5ga1niyvpV48BNG";
        }
    })();
</script>
